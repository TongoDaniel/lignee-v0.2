# Mises à jour des dépendances (TRD, « Tests et qualité », Sécurité ; « mises à jour de sécurité
# chaque semaine »). Les alertes et les correctifs de sécurité de Dependabot sont gratuits sur un
# dépôt privé ; ils s'activent dans Settings > Code security (docs/runbooks/proteger-main.md).
#
# `cooldown` : une version n'est proposée que 14 jours après sa publication (règle du projet).
# Les correctifs de sécurité ne l'attendent pas.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Douala
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(exploitation)
    labels: [exploitation]
    # App mobile : React, React Native et les modules natifs suivent le SDK Expo
    # (bundledNativeModules). Monter l'un d'eux seul casse le build natif : ils changent ensemble,
    # au changement de SDK (`npx expo install --fix`, docs/runbooks/lancer-app-mobile.md).
    ignore:
      - dependency-name: expo
        update-types: [version-update:semver-major]
      - dependency-name: "expo-*"
        update-types: [version-update:semver-major]
      - dependency-name: "@expo/*"
        update-types: [version-update:semver-major]
      - dependency-name: jest-expo
        update-types: [version-update:semver-major]
      - dependency-name: react
      - dependency-name: react-test-renderer
      - dependency-name: react-native
      - dependency-name: "@react-native/*"
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: "react-native-*"
        update-types: [version-update:semver-major, version-update:semver-minor]
      # jest-expo 57 s'appuie sur Jest 29 ; expo-router 57 sur React Native Testing Library 13.
      - dependency-name: jest
        update-types: [version-update:semver-major]
      - dependency-name: "@types/jest"
        update-types: [version-update:semver-major]
      - dependency-name: "@testing-library/react-native"
        update-types: [version-update:semver-major]
    groups:
      # Une seule pull request par semaine pour les versions mineures et correctives.
      mineures-et-correctifs:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Douala
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(exploitation)
    labels: [exploitation]
    groups:
      actions-github:
        patterns: ["*"]

  # Images de base des Dockerfiles (Node) et images de compose.yaml (PostgreSQL, MinIO), épinglées
  # par version et par empreinte : Dependabot met à jour les deux.
  - package-ecosystem: docker
    directories: [/apps/api, /apps/worker]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Douala
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(exploitation)
    labels: [exploitation]
    groups:
      images-node:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Douala
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(exploitation)
    labels: [exploitation]
    ignore:
      # Une nouvelle version majeure de PostgreSQL demande une migration des données
      # (pg_upgrade ou sauvegarde et restauration) : décision à part, pas une mise à jour.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
