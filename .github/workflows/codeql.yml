# Analyse du code par CodeQL (TRD, « Tests et qualité », Sécurité).
#
# Sur un dépôt privé, CodeQL demande GitHub Code Security (payant, par contributeur actif) :
# sans lui, l'envoi des résultats échoue. Le job ne tourne donc que si le dépôt est public, ou si
# la variable de dépôt CODEQL_ENABLED vaut `true` (Settings > Secrets and variables > Actions >
# Variables), une fois Code Security activé. Sinon il apparaît « skipped » : ni vert ni rouge.
# Ne le rendez obligatoire sur `main` qu'une fois activé (docs/runbooks/proteger-main.md).

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Chaque lundi à 5 h 17 UTC : nouvelles requêtes sur un code qui n'a pas bougé.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: codeql
    if: ${{ !github.event.repository.private || vars.CODEQL_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Préparer CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          # TypeScript s'analyse sans construction.
          build-mode: none
          queries: security-extended

      - name: Analyser
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
