# Intégration continue de Lignée (TRD, « Environnements, CI/CD et livraison » et « Tests et qualité »).
# Un job qui échoue bloque la fusion, une fois les vérifications rendues obligatoires sur `main`
# (docs/runbooks/proteger-main.md). Les noms des jobs sont ceux à cocher : ne les renommez pas
# sans mettre le runbook et la protection de branche à jour.
#
# Actions épinglées par SHA de commit complet (version en commentaire) ; Dependabot les met à jour.

name: CI

on:
  pull_request:
    # `edited` : le titre de la pull request devient le message du commit fusionné (squash),
    # il est revérifié quand on le modifie.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # Lint, types, tests unitaires et de propriétés (Vitest, fast-check), mise en forme,
  # contrôle CON-12, messages de commit et titre de la pull request : tout ce qui n'a besoin
  # que de Node.
  verifications:
    name: verifications
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet sur une pull request, pour vérifier tous ses commits.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      - name: Installer pnpm (version de packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Installer Node (version de .nvmrc) et le cache pnpm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        id: install
        run: pnpm install --frozen-lockfile

      # Les étapes suivantes tournent même si l'une d'elles échoue, pour tout voir en une fois.
      - name: CON-12 — aucune bibliothèque de reconnaissance faciale
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:forbidden-dependencies

      - name: Mise en forme (Prettier)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

      - name: Lint (ESLint)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Types (tsc)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Tests unitaires et de propriétés (Vitest)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run test

      # Les messages de Dependabot ne suivent pas les conventions (lignes de plus de 100
      # caractères) : ils ne sont pas vérifiés.
      - name: Messages de commit (commitlint)
        if: >-
          ${{ !cancelled() && steps.install.outcome == 'success'
          && github.event_name == 'pull_request'
          && github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      # La fusion se fait par squash (docs/runbooks/proteger-main.md) : le titre devient le
      # message du commit sur `main`. Il passe par une variable d'environnement, jamais
      # interpolé dans le script (injection de commande). Vérifié aussi pour Dependabot.
      - name: Titre de la pull request (commitlint)
        if: >-
          ${{ !cancelled() && steps.install.outcome == 'success'
          && github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

  # Analyse des dépendances (TRD, « Tests et qualité », Sécurité) : échoue sur une faille haute
  # ou critique connue. Dependabot ouvre les correctifs (.github/dependabot.yml).
  audit-dependances:
    name: audit-dependances
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer pnpm (version de packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Installer Node (version de .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # pnpm audit lit pnpm-lock.yaml : pas besoin d'installer les dépendances.
      - name: Failles hautes et critiques (pnpm audit)
        run: pnpm audit --audit-level high

  # Construction des images Docker (API, worker), sans publication : la publication sur GitHub
  # Container Registry arrive avec le déploiement de la préproduction (T-068). Chaque Dockerfile
  # ou Containerfile du dépôt (toute casse, `Dockerfile.api` compris) doit être construit par un
  # service de compose.yaml : un fichier ajouté sans service fait échouer le job.
  images-docker:
    name: images-docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HADOLINT_IMAGE: hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Valeurs factices et publiques, lues par compose.yaml.
      - name: Fichier d'environnement local
        run: cp .env.example .env

      - name: Chaque Dockerfile est construit par compose.yaml
        id: dockerfiles
        run: |
          files=$(git ls-files ':(icase)*dockerfile' ':(icase)*dockerfile.*' ':(icase)*containerfile' ':(icase)*containerfile.*')
          if [ -z "$files" ]; then
            echo "::error title=Aucun Dockerfile::Les Dockerfiles de l'API et du worker ont disparu."
            exit 1
          fi
          # Chemins relatifs au contexte de construction, la racine du dépôt.
          built=$(docker compose --profile '*' config --format json \
            | jq -r '.services[] | select(.build != null) | .build.dockerfile' | sort -u)
          missing=""
          for file in $files; do
            if ! printf '%s\n' "$built" | grep -qxF -- "$file"; then
              missing="$missing $file"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Image non construite::Dockerfile(s) sans service dans compose.yaml :$missing"
            exit 1
          fi
          {
            echo "### Images Docker"
            echo
            echo "Construites, sans publication (prévue en T-068) :"
            for file in $files; do echo "- \`$file\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Lint des Dockerfiles (hadolint)
        env:
          FILES: ${{ steps.dockerfiles.outputs.files }}
        run: |
          status=0
          for file in $FILES; do
            echo "hadolint $file"
            docker run --rm -i "$HADOLINT_IMAGE" < "$file" || status=1
          done
          exit "$status"

      - name: Construire les images
        run: docker compose --profile '*' build

      # Les paquets n'ont pas encore de programme (T-043, T-075) : l'image doit démarrer Node,
      # exécuter src/index.ts et s'arrêter sans erreur, sous un utilisateur autre que root.
      - name: Démarrer chaque image
        run: |
          images=$(docker compose --profile '*' config --format json \
            | jq -r '.services[] | select(.build != null) | .image' | sort -u)
          if [ -z "$images" ]; then
            echo "::error title=Aucune image::compose.yaml ne construit aucune image."
            exit 1
          fi
          for image in $images; do
            uid=$(docker run --rm --entrypoint id "$image" -u)
            if [ "$uid" = "0" ]; then
              echo "::error title=Image lancée en root::$image tourne sous root."
              exit 1
            fi
            docker run --rm --network none "$image"
            echo "$image : démarrée et arrêtée sans erreur (utilisateur $uid)."
          done

  # Environnement local (compose.yaml, docs/runbooks/environnement-local.md) : démarre PostgreSQL
  # et MinIO comme sur un poste, puis vérifie ce que le TRD exige de la base (extensions,
  # utilisateur applicatif sans droit sur le schéma, utilisateur de migration séparé) et du
  # stockage (compartiment privé, clé de l'application limitée à ce compartiment).
  environnement-local:
    name: environnement-local
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fichier d'environnement local
        run: cp .env.example .env

      - name: Démarrer (docker compose up -d)
        run: |
          docker compose up -d
          docker compose up -d --wait --wait-timeout 180 postgres minio
          code=$(docker wait "$(docker compose ps --all --quiet minio-init)")
          if [ "$code" != "0" ]; then
            echo "::error title=Compartiment non créé::minio-init s'est arrêté avec le code $code."
            exit 1
          fi

      # Le contrôle n'utilise que Node (pas de dépendance à installer) : tools/ci/src/local-env.ts.
      - name: Installer Node (version de .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Extensions, droits des utilisateurs, compartiment privé
        run: node tools/ci/src/check-local-env.ts

      # Réseau `poste` (compose.yaml, ADR 0007) : les ports publiés sur 127.0.0.1 répondent, mais
      # les conteneurs ne sortent pas sur Internet. Témoin : le runner, lui, y accède.
      - name: Ports publiés sur le poste, aucune sortie vers Internet
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a
          if ! timeout 5 bash -c "exec 3<>/dev/tcp/127.0.0.1/${LIGNEE_PG_PORT}"; then
            echo "::error title=Port non publié::PostgreSQL injoignable sur 127.0.0.1:${LIGNEE_PG_PORT}."
            exit 1
          fi
          echo "ok - PostgreSQL publié sur 127.0.0.1:${LIGNEE_PG_PORT}"
          # MinIO : déjà interrogé depuis le poste par check-local-env (accès anonyme refusé, 403).
          url=https://github.com
          if ! curl --silent --show-error --max-time 10 --output /dev/null "$url"; then
            echo "::error title=Témoin::Le runner n'atteint pas $url : contrôle de sortie impossible."
            exit 1
          fi
          if docker compose exec -T minio curl --silent --max-time 10 --output /dev/null "$url"; then
            echo "::error title=Sortie vers Internet::Le conteneur minio atteint $url."
            exit 1
          fi
          echo "ok - le conteneur minio n'atteint pas $url (le runner, si)"

      # Limite connue (ADR 0007) : le résolveur embarqué de Docker relaie sans doute les requêtes
      # DNS vers l'hôte. Relevé dans le résumé, sans faire échouer le job.
      - name: Résolution DNS depuis minio (relevé)
        run: |
          if resolved=$(docker compose exec -T minio getent hosts github.com); then
            message="Le conteneur minio résout github.com ($(echo "$resolved" | head -n 1)) sans pouvoir s'y connecter : limite connue de l'ADR 0007."
            echo "::notice title=DNS depuis minio::$message"
          else
            message="Le conteneur minio ne résout pas github.com."
          fi
          echo "$message"
          { echo "### Résolution DNS depuis minio"; echo; echo "$message"; } >> "$GITHUB_STEP_SUMMARY"

      # Le compartiment et la clé existent déjà : le second passage ne doit rien casser.
      - name: Redémarrer sans remise à zéro
        run: |
          docker compose up -d --force-recreate --no-deps minio-init
          code=$(docker wait "$(docker compose ps --all --quiet minio-init)")
          if [ "$code" != "0" ]; then
            echo "::error title=Redémarrage::minio-init s'est arrêté avec le code $code au second passage."
            exit 1
          fi
          echo "ok - second passage de minio-init sans erreur"

      - name: Contrôles après le second passage
        run: |
          node tools/ci/src/check-local-env.ts
          {
            echo "### Environnement local"
            echo
            echo "PostgreSQL : extensions pg_trgm, unaccent et fuzzystrmatch ; lignee_app ne crée ni table, ni table temporaire, ni schéma, et ne se connecte pas à la base postgres ; lignee_migration crée les tables."
            echo
            echo "MinIO : compartiment privé ; la clé de l'application ne crée pas de compartiment et ne lit ni n'écrit dans un autre ; aucune sortie vers Internet."
            echo
            echo "Contrôles rejoués après un second passage de minio-init."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Journaux des conteneurs
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Arrêter et effacer
        if: always()
        run: docker compose down --volumes --remove-orphans

  # ---------------------------------------------------------------------------------------------
  # Étapes prévues par le TRD qui n'ont pas encore de matière. Chacune vérifie qu'il n'y a
  # rien à tester, le dit dans le résumé, et échoue dès que la matière apparaît sans que le job
  # soit branché. Seule exception, listée nommément : les scénarios en attente de T-006.
  # ---------------------------------------------------------------------------------------------

  # Cas limites : un fichier test/scenarios/<ID>.yaml par cas, joué par un test.
  # Un scénario est joué quand un test l'a réellement chargé pendant l'exécution : les tests
  # tournent avec LIGNEE_SCENARIOS_PLAYED_DIR, et `loadScenario` (packages/domain/src/
  # test-support/scenario.ts, en attendant le lecteur de T-006) y laisse un fichier par scénario
  # chargé et validé. Un test ignoré, un commentaire ou un paquet dont les tests ne tournent pas
  # ne comptent pas. Les scénarios non joués de PENDING_T006 sont tolérés (vert avec
  # avertissement) ; tout autre scénario non joué fait échouer le job. N'allongez pas cette liste
  # pour faire passer un scénario : écrivez son test.
  cas-limites:
    name: cas-limites
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer pnpm (version de packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Installer Node (version de .nvmrc) et le cache pnpm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Jouer les tests en relevant les scénarios chargés
        env:
          LIGNEE_SCENARIOS_PLAYED_DIR: ${{ runner.temp }}/scenarios-joues
        run: pnpm turbo run test --force

      - name: Scénarios non joués
        env:
          PLAYED_DIR: ${{ runner.temp }}/scenarios-joues
          # Scénarios écrits avant le lecteur de T-006, non joués : liste fermée.
          PENDING_T006: test/scenarios/CL-POL-03.yaml
        run: |
          played=""
          pending=""
          unexpected=""
          for file in $(git ls-files 'test/scenarios/*.yaml' 'test/scenarios/*.yml'); do
            id="$(basename "$file")"
            id="${id%.*}"
            if [ -f "$PLAYED_DIR/$id" ]; then
              played="$played $file"
              continue
            fi
            case " $PENDING_T006 " in
              *" $file "*) pending="$pending $file" ;;
              *) unexpected="$unexpected $file" ;;
            esac
          done
          {
            echo "### Cas limites"
            echo
            if [ -n "$played" ]; then
              echo "Joués par un test :$played"
            fi
            if [ -n "$pending" ]; then
              echo "Non joués, en attente du lecteur de scénarios (T-006) :$pending"
            fi
            if [ -n "$unexpected" ]; then
              echo "Non joués et hors de la liste d'attente :$unexpected"
            fi
            if [ -z "$played$pending$unexpected" ]; then
              echo "Aucun scénario de cas limite pour l'instant."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$pending" ]; then
            echo "::warning title=Cas limites non joués (T-006)::Scénarios présents mais joués par aucun test, en attente de T-006 :$pending"
          fi
          if [ -n "$unexpected" ]; then
            echo "::error title=Cas limites non joués::Scénarios chargés par aucun test pendant l'exécution :$unexpected. Écrivez leur test (loadScenario dans le corps d'un it) ; seuls ceux de PENDING_T006 sont tolérés jusqu'à T-006."
            exit 1
          fi
          echo "Scénarios en attente de T-006 :${pending:- aucun}"

  # Intégration avec PostgreSQL réel (Vitest et Testcontainers) : droits, synchro, propositions.
  # Convention : fichiers `*.integration.test.ts`. À remplir avec le schéma Prisma (T-042) et
  # les premières routes (T-043, T-048, T-049).
  integration-postgresql:
    name: integration-postgresql
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tests d'intégration à jouer
        run: |
          files=$(git ls-files '*.integration.test.ts')
          if [ -n "$files" ]; then
            echo "::error title=Intégration PostgreSQL non branchée::Des tests d'intégration existent ($(echo $files)) mais ce job ne les lance pas encore. Branchez Testcontainers ici."
            exit 1
          fi
          message="Aucun test d'intégration PostgreSQL pour l'instant (schéma Prisma en T-042, API en T-043)."
          echo "$message"
          { echo "### Intégration PostgreSQL"; echo; echo "$message"; } >> "$GITHUB_STEP_SUMMARY"

  # Taille des réponses de synchronisation sur des arbres types de 100, 1 000 et 5 000 personnes
  # (TRD, « Médias et économie de données », Contrôle). Convention : un script `test:sync-size`
  # dans un package.json. À remplir par T-064.
  taille-synchro:
    name: taille-synchro
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mesure à faire
        run: |
          files=$(git grep -l '"test:sync-size"' -- '*package.json' || true)
          if [ -n "$files" ]; then
            echo "::error title=Taille de synchro non branchée::Un script test:sync-size existe ($(echo $files)) mais ce job ne le lance pas encore."
            exit 1
          fi
          message="Aucune réponse de synchronisation à mesurer pour l'instant (protocole de synchro, puis mesure en T-064)."
          echo "$message"
          { echo "### Taille des réponses de synchronisation"; echo; echo "$message"; } >> "$GITHUB_STEP_SUMMARY"
