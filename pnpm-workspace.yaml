# `pnpm deploy` (images Docker de l'API et du worker) copie les paquets du monorepo au lieu de les
# lier, et suit le lockfile partagé. Sans ce réglage, il faut `--legacy`, qui ignore le lockfile.
injectWorkspacePackages: true

packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

# Versions partagées par tous les paquets (protocole `catalog:`).
catalog:
  "@eslint/js": 10.0.1
  "@types/node": 24.19.0
  eslint: 10.11.0
  fast-check: 4.10.2
  typescript: 6.0.3
  vitest: 5.0.3
  yaml: 2.9.1
  zod: 4.6.5
