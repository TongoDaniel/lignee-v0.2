    pourquoi: "Mère de naissance d'une enfant adoptée : lien de naissance, gardé à côté de l'adoption (PAR-06) ; côté « parent », car Tsouette a aussi une mère adoptive (deux mères, ADR 0017, point 6 ; CL-FAM-08)."
    attendu:
      - chemin: "1/0[muine]"
        cote_de: { par: muine, cote: parent }
        fr: à rédiger
        en: à rédiger
  - id: F06-05
    de: nayoun
    vers: muine
    categorie: non_biologique_certitude
    pourquoi: "Mère de naissance de la sœur adoptive : ni ancêtre commun, ni union ; une adoption ne crée pas d'alliance (ADR 0010, point 4) : aucun lien."
    attendu: aucun
  - id: F06-06
    de: tilei
    vers: kie
    categorie: non_biologique_certitude
    pourquoi: "L'a élevé (PAR-06) d'abord, et aussi mari de la mère, union successive à celle du père : celui qui a élevé n'est pas un autre parent (ADR 0021, point 6 ; CL-FAM-02). Côté « parent » pour Kie, Tilei ayant aussi un père de naissance (ADR 0017, point 6) : les mots disent le type, jamais « père »."
    attendu:
      - chemin: "1/0[kie]"
        base: [raised]
        cote_de: { par: kie, cote: parent, type: raised }
        fr: à rédiger
        en: à rédiger
      - chemin: "1/0[gae] =kie"
        alliance: { type: spouse_of_parent, autre_parent: [successive] }
        cote_de: { par: gae, cote: mother }
        fr: à rédiger
        en: à rédiger
  - id: F06-07
    de: tilei
    vers: pungom
    categorie: non_biologique_certitude
    pourquoi: "Père de naissance d'un enfant élevé par un autre : « père », jamais confondu avec « l'a élevé » (PAR-06)."
    attendu:
      - chemin: "1/0[pungom]"
        cote_de: { par: pungom, cote: father }
        fr: à rédiger
        en: à rédiger
