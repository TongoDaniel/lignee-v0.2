    pourquoi: "Confié à Kie (kafala, CL-FAM-05) : « personne à qui vous êtes confié », jamais « père » (PAR-06 ; ADR 0021, point 7) ; côté « parent », Djoe ayant un père de naissance (ADR 0017, point 6)."
    attendu:
      - chemin: "1/0[kie]"
        base: [fostered]
