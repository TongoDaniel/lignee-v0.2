# Prénoms générés (generateGivenName, graine 2300) ; famille composée, jamais une vraie famille.
# Kie et Gae : fils de naissance Nayoun et Pawoum (paternité de Kie « probable » pour Pawoum),
# fille adoptive Tsouette (mère de naissance Muine). Gae a d'abord eu Tilei avec Pungom (union
# 1980-1984, divorce) ; Kie, qu'elle épouse en 1986, a élevé Tilei. Djoe (parents Yetchao et Noia)
# est confié à Kie (confiage, kafala). Hun est le tuteur de Moudjoia. Zeine est née de Wafuou,
# avec Pei pour donneur ; Djodjeou est née de Mbao et Fakae, portée par Njinouia (gestation pour
# autrui). Le père de Kie, Mbanyam, est « probable » ; la mère de Gae, Zofouou, « hypothétique ».
# Maette a mis au monde Tsukaine, Takweette et Mbupea ; sa conjointe Leette a adopté les deux
# premières.
famille: F06
titre: Liens non biologiques et certitude
origine: composee
arbre:
  personnes:
    - kie/M
    - gae/F
    - nayoun/M
    - pawoum/M
    - tsouette/F
    - muine/F
    - pungom/M
    - tilei/M
    - djoe/M
    - yetchao/M
    - noia/F
    - hun/M
    - moudjoia/F
    - zeine/F
    - wafuou/F
    - pei/M
    - djodjeou/F
    - mbao/M
    - fakae/F
    - njinouia/F
    - mbanyam/M
    - zofouou/F
    - maette/F
    - leette/F
    - tsukaine/F
    - takweette/F
    - mbupea/M
  unions:
    - conjoints: [gae, pungom]
      debut: { qualificatif: exacte, date: "1980" }
      fin: { qualificatif: exacte, date: "1984" }
      motif: divorce
    - { conjoints: [kie, gae], debut: { qualificatif: exacte, date: "1986" } }
    - { conjoints: [mbao, fakae] }
    - { conjoints: [maette, leette] }
  filiations:
    - { parents: [kie, gae], enfant: nayoun }
    - { parents: [gae], enfant: pawoum }
    - { parents: [kie], enfant: pawoum, certitude: probable }
    - { parents: [kie, gae], enfant: tsouette, type: adoptive }
    - { parents: [muine], enfant: tsouette }
    - { parents: [gae, pungom], enfant: tilei }
    - { parents: [kie], enfant: tilei, type: a_eleve }
    - { parents: [yetchao, noia], enfant: djoe }
    - { parents: [kie], enfant: djoe, type: confie }
    - { parents: [hun], enfant: moudjoia, type: tuteur }
    - { parents: [wafuou], enfant: zeine }
    - { parents: [pei], enfant: zeine, type: donneur }
    - { parents: [mbao, fakae], enfant: djodjeou }
    - { parents: [njinouia], enfant: djodjeou, type: gpa }
    - { parents: [mbanyam], enfant: kie, certitude: probable }
    - { parents: [zofouou], enfant: gae, certitude: hypothetique }
    - { parents: [maette], enfant: tsukaine }
    - { parents: [maette], enfant: takweette }
    - { parents: [maette], enfant: mbupea }
    - { parents: [leette], enfant: tsukaine, type: adoptive }
    - { parents: [leette], enfant: takweette, type: adoptive }
paires:
  - id: F06-01
    de: nayoun
    vers: tsouette
    categorie: non_biologique_certitude
    pourquoi: "Fille adoptive de ses parents : aucun parent commun par la naissance, deux par la naissance ou l'adoption, d'où « sœur par adoption », jamais « sœur » (PAR-06 ; ADR 0021, point 5)."
    attendu:
      - chemin: "1/1[gae+kie]"
        fratrie: { type: adoption, partage: full }
        base: [adoptive]
        fr: à rédiger
        en: à rédiger
  - id: F06-02
    de: tsouette
    vers: kie
    categorie: non_biologique_certitude
    pourquoi: "Père adoptif (PAR-06) ; aucun « mari de votre mère », un parent adoptif est un autre parent (ADR 0021, point 6)."
    attendu:
      - chemin: "1/0[kie]"
        base: [adoptive]
        cote_de: { par: kie, cote: father, type: adoptive }
        fr: à rédiger
        en: à rédiger
  - id: F06-03
    de: kie
    vers: tsouette
    categorie: non_biologique_certitude
    pourquoi: "Fille adoptive (PAR-06, « fils adoptif ») ; elle monte vers lui par l'adoption."
    attendu:
      - chemin: "0/1[kie]"
        base: [adoptive]
        cote_vers: { par: kie, cote: father, type: adoptive }
