# Prénoms générés (generateGivenName, graine 2300) ; famille composée, jamais une vraie famille.
# Implexe. Gim et Genei ont Tchenon, Nyeneou et Foou. Ngen (fils de Tchenon et Honjuia) épouse sa
# cousine germaine Yue (fille de Nyeneou et Zindoe) : fils Kuvae (CL-FAM-09). Foou épouse sa
# nièce Nyoe, fille de Tchenon : fils Kwitchoui (union entre générations, CL-FAM-10). Doubles
# cousins : les frères Tchue et Mbie (parents Budjouo et Yeyiette) épousent les sœurs Zea et
# Kwakaa (parents Fovouo et Vakwaette) : Sun et Hakwie.
