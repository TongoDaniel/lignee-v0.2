paires:
  - id: F09-01
    de: tchudjoette
    vers: mbaine
    categorie: polygamie
    pourquoi: "Deux épouses de Nyouvui, simultanées (réponse gardée) : co-épouses ; et aussi grand-mère de la bru de son fils (Soe, épouse de Soou) : une union, quatre générations, limite de l'ADR 0010."
    attendu:
      - chemin: "=nyouvui =mbaine"
        alliance: { type: co_spouse, simultaneite: simultaneous }
        fr:
          court: "co-épouse"
          explique: "autre épouse de votre mari, Nyouvui, en même temps que vous"
        en: à rédiger
      - chemin: "0/2[tchudjoette] =soe 2/0[mbaine]"
        alliance: { type: other }
        fr:
          court: "mère du père de l’épouse de votre petit-fils"
          explique: "mère de Mboe, père de l’épouse du fils de votre fils"
        en: à rédiger
