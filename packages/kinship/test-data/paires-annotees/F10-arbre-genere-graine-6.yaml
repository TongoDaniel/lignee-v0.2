paires:
  - id: F10-01
    de: vio
    vers: lakoette
    categorie: levirat_sororat
    pourquoi: "Lévirat : demi-sœur, même mère, d'abord ; et aussi cousine par le père (Sondom et Fouyee frères, paternité probable) ; et aussi par Ndoufeine, épouse des deux frères (deux unions, deux générations)."
    attendu:
      - chemin: "1/1[yaou]"
        fratrie: { type: birth, partage: half, cote: mother }
        fr: à rédiger
        en: à rédiger
      - chemin: "2/2[meluo+tsenee]"
        certitude: probable
        cote_de: { par: sondom, cote: father }
        cote_vers: { par: fouyee, cote: father }
        fr: à rédiger
        en: à rédiger
      - chemin: "1/0[sondom] =ndoufeine =fouyee 0/1[fouyee]"
        alliance:
          type: other
          simultaneite: successive
          autre_parent: [simultaneous, simultaneous]
        cote_de: { par: sondom, cote: father }
        cote_vers: { par: fouyee, cote: father }
        fr: à rédiger
        en: à rédiger
