# Prénoms générés (generateGivenName, graine 2300) ; famille composée, jamais une vraie famille.
# Lévirat : Yemui et Yalom sont frères (parents Kwengim et Noe). Zolae épouse Yemui (1960-1968,
# décès de Yemui), puis son frère Yalom (1970), déjà marié à Lefeou (unions simultanées, réponse
# gardée). Sororat : Tasao épouse les sœurs Ndohoette et Njovoou en même temps (réponse gardée).
famille: F03
titre: Lévirat et sororat
origine: composee
arbre:
  personnes:
    - kwengim/M
    - noe/F
    - yemui/M
    - yalom/M
    - zolae/F
    - lefeou/F
    - nugeou/M
    - gaine/F
    - sovee/M
    - noa/F
    - sam/M
    - kwio/M
    - haette/F
    - ndohoette/F
    - njovoou/F
    - tasao/M
    - mboutim/M
    - ziou/F
  unions:
    - { conjoints: [kwengim, noe] }
    - conjoints: [yemui, zolae]
      debut: { qualificatif: exacte, date: "1960" }
      fin: { qualificatif: exacte, date: "1968" }
      motif: deces
    - { conjoints: [yalom, lefeou], rang_yalom: 1 }
    - conjoints: [yalom, zolae]
      rang_yalom: 2
      debut: { qualificatif: exacte, date: "1970" }
    - { conjoints: [kwio, haette] }
    - { conjoints: [tasao, ndohoette], rang_tasao: 1 }
    - { conjoints: [tasao, njovoou], rang_tasao: 2 }
  filiations:
    - { parents: [kwengim, noe], enfant: yemui }
    - { parents: [kwengim, noe], enfant: yalom }
    - { parents: [yemui, zolae], enfant: nugeou }
    - { parents: [yemui, zolae], enfant: gaine }
    - { parents: [yalom, zolae], enfant: sovee }
    - { parents: [yalom, zolae], enfant: noa }
    - { parents: [yalom, lefeou], enfant: sam }
    - { parents: [kwio, haette], enfant: ndohoette }
    - { parents: [kwio, haette], enfant: njovoou }
    - { parents: [tasao, ndohoette], enfant: mboutim }
    - { parents: [tasao, njovoou], enfant: ziou }
