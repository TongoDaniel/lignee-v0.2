# Prénoms générés (generateGivenName, graine 2300) ; famille composée, jamais une vraie famille.
# Lignée de six générations depuis Nehae et Lie. Trois branches : Seloi (avec Yekaa : Soou et
# Pasoe ; puis Yon, Biwiou, Kegee, de père en fils), Vie (Nesoine, Viia, Tchetea, Ndonaine, de
# mère en fille) et Toui (Veo, de genre non renseigné, puis Fea). Sous la première génération,
# chaque enfant n'a qu'un parent saisi : les sommets des cousins sont Nehae et Lie. Ndei, de genre
# « autre », est l'enfant de Pasoe.
famille: F05
titre: Degrés civils, oncles à la mode de Bretagne et générations décalées
origine: composee
arbre:
  personnes:
    - nehae/M
    - lie/F
    - seloi/M
    - yekaa/F
    - vie/F
    - toui/M
    - soou/M
    - pasoe/F
    - yon/M
    - biwiou/M
    - kegee/M
    - nesoine/F
    - viia/F
    - tchetea/F
    - ndonaine/F
    - veo/N
    - fea/F
    - ndei/A
  unions:
    - { conjoints: [nehae, lie] }
    - { conjoints: [seloi, yekaa] }
  filiations:
    - { parents: [nehae, lie], enfant: seloi }
    - { parents: [nehae, lie], enfant: vie }
    - { parents: [nehae, lie], enfant: toui }
    - { parents: [seloi, yekaa], enfant: soou }
    - { parents: [seloi, yekaa], enfant: pasoe }
    - { parents: [soou], enfant: yon }
    - { parents: [yon], enfant: biwiou }
    - { parents: [biwiou], enfant: kegee }
    - { parents: [vie], enfant: nesoine }
    - { parents: [nesoine], enfant: viia }
    - { parents: [viia], enfant: tchetea }
    - { parents: [tchetea], enfant: ndonaine }
    - { parents: [toui], enfant: veo }
    - { parents: [veo], enfant: fea }
    - { parents: [pasoe], enfant: ndei }
paires:
