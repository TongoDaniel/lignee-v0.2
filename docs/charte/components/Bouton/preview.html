<head><meta charset="utf-8"><title>Bouton</title></head>
<body>
<div class="lg-zone">
  <button class="lg-bouton lg-bouton--principal">Oui, ajouter</button>
  <button class="lg-bouton lg-bouton--secondaire">Corriger</button>
  <button class="lg-bouton lg-bouton--discret">Plus tard</button>
