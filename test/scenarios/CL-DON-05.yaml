# Partie date (T-005) : « vers 1940 » est une date approximative, placée à son rang dans un tri
# de dates de précisions différentes. La chronologie qui la signale est V2.
# Notation des dates : « date » vaut AAAA, AAAA-MM ou AAAA-MM-JJ, la précision en est déduite
# sauf « decennie », écrite à part.
# Reste : la saisie (T-031) ; la chronologie (V2, MEM-11) est hors du plan V1.
id: CL-DON-05
titre: « Né vers 1940 »
couverture:
  teste: [modele, saisie]
  reste: []
action:
  saisie: "né vers 1940"
  date: { qualificatif: vers, date: "1940", texte: "vers 1940" }
attendu:
  valide: true
  approximative: true
  precision: annee
  # Ordre attendu d'un tri, la date saisie comprise (« vers 1940 »), texte libre en fin.
  ordre:
    - { qualificatif: exacte, date: "1939-12-31" }
    - { qualificatif: avant, date: "1940" }
    - { qualificatif: exacte, date: "1940", precision: decennie }
    - { qualificatif: exacte, date: "1940" }
    - { qualificatif: vers, date: "1940", texte: "vers 1940" }
    - { qualificatif: exacte, date: "1940-01-01" }
    - { qualificatif: exacte, date: "1940-07" }
    - { qualificatif: exacte, date: "1940-07-14" }
    - { qualificatif: apres, date: "1940" }
    - { qualificatif: exacte, date: "1941" }
    - { qualificatif: texte, texte: "l'année de la grande sécheresse" }
  # T-031 : « vers 1940 » et « années 1940 » se saisissent par morceaux (choix, année, décennie).
  saisie:
    dates:
      - formulaire: { choix: vers, annee: "1940" }
        attendue: { qualificatif: vers, date: "1940" }
      - formulaire: { choix: exacte, annee: "1940", decennie: true }
        attendue: { qualificatif: exacte, date: "1940", precision: decennie }
      - formulaire: { choix: vers, annee: "1940", decennie: true }
        attendue: { qualificatif: vers, date: "1940", precision: decennie }
      - formulaire: { choix: apres, annee: "1940", mois: "7" }
        attendue: { qualificatif: apres, date: "1940-07" }
      - formulaire: { choix: exacte, annee: "1431", calendrier: hegirien }
        attendue: { qualificatif: exacte, date: "1431", calendrier: hegirien }
    dates_refusees:
      - { formulaire: { choix: vers }, code: year_required }
      - { formulaire: { choix: vers, annee: "19x0" }, code: year_invalid }
      - { formulaire: { choix: vers, annee: "1945", decennie: true }, code: decade_year_invalid }
      - { formulaire: { choix: exacte, annee: "1940", mois: "13" }, code: month_invalid }
      - { formulaire: { choix: exacte, annee: "1940", jour: "3" }, code: day_needs_month }
      - { formulaire: { choix: exacte, annee: "1941", mois: "2", jour: "29" }, code: day_invalid }
      - { formulaire: { choix: texte }, code: text_required }
