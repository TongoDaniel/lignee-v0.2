# Noms générés. Noms successifs datés : mariage, conversion, francisation. Les dates restent du
# texte tant que les dates floues (T-005) ne sont pas là. La saisie (T-031) est la partie saisie.
id: CL-FAM-18
titre: Changement de nom (mariage, conversion, francisation)
couverture:
  teste: [modele, saisie]
  reste: []
arbre:
  personnes: [marthe/F, ngassa/M]
  noms:
    - { personne: marthe, type: naissance, prenoms: Marthe, nom: Tchoupa, fin: "1978" }
    - { personne: marthe, type: usage, prenoms: Marthe, nom: Essaka, debut: "1978", fin: "1991" }
    - { personne: marthe, type: usage, prenoms: Aminatou, nom: Essaka, debut: "1991" }
    - { personne: ngassa, type: naissance, prenoms: Ngassa, nom: Mbolang, fin: "vers 1960" }
    - { personne: ngassa, type: variante, prenoms: Nicolas, nom: Mbolang, debut: "vers 1960" }
attendu:
  valide: true
  noms_dates:
    marthe:
      - { nom: Tchoupa, prenoms: Marthe, fin: "1978" }
      - { nom: Essaka, prenoms: Marthe, debut: "1978", fin: "1991" }
      - { nom: Essaka, prenoms: Aminatou, debut: "1991" }
    ngassa:
      - { nom: Mbolang, prenoms: Ngassa, fin: "vers 1960" }
      - { nom: Mbolang, prenoms: Nicolas, debut: "vers 1960" }
  # T-031 : les noms successifs se saisissent avec leurs dates, qui deviennent de vraies dates floues.
  saisie:
    personnes:
      - formulaire:
          noms:
            - {
                type: naissance,
                prenoms: Marthe,
                nom: Tchoupa,
                fin: { choix: exacte, annee: "1978" },
              }
            - type: usage
              prenoms: Marthe
              nom: Essaka
              debut: { choix: exacte, annee: "1978" }
              fin: { choix: exacte, annee: "1991" }
            - {
                type: usage,
                prenoms: Aminatou,
                nom: Essaka,
                debut: { choix: exacte, annee: "1991" },
              }
        resultat:
          nature: connue
          noms:
            - {
                type: naissance,
                prenoms: Marthe,
                nom: Tchoupa,
                fin: { qualificatif: exacte, date: "1978" },
              }
            - type: usage
              prenoms: Marthe
              nom: Essaka
              debut: { qualificatif: exacte, date: "1978" }
              fin: { qualificatif: exacte, date: "1991" }
            - {
                type: usage,
                prenoms: Aminatou,
                nom: Essaka,
                debut: { qualificatif: exacte, date: "1991" },
              }
      - formulaire:
          noms:
            - {
                type: naissance,
                prenoms: Ngassa,
                nom: Mbolang,
                fin: { choix: vers, annee: "1960" },
              }
            - {
                type: variante,
                prenoms: Nicolas,
                nom: Mbolang,
                debut: { choix: vers, annee: "1960" },
              }
        resultat:
          nature: connue
          noms:
            - {
                type: naissance,
                prenoms: Ngassa,
                nom: Mbolang,
                fin: { qualificatif: vers, date: "1960" },
              }
            - {
                type: variante,
                prenoms: Nicolas,
                nom: Mbolang,
                debut: { qualificatif: vers, date: "1960" },
              }
