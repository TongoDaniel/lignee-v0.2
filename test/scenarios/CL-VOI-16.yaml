# Partie calcul (T-005, VOX-14) : l'âge au décès et l'année du décès donnent une naissance
# calculée, marquée approximative. La compréhension de la phrase dictée revient à la voix (T-066).
id: CL-VOI-16
titre: « Il est mort à 80 ans en 2010 »
couverture:
  teste: [modele]
  reste: [T-066]
action:
  dictee: "Il est mort à 80 ans en 2010"
  calcul: { age: 80, deces: { qualificatif: exacte, date: "2010" } }
attendu:
  naissance: { qualificatif: calculee, date: "1930" }
  approximative: true
