# Exemple repris du TRD (Tests et qualité). Un fichier par identifiant de l'onglet Cas limites.
# Partie lecture (T-006) : le scénario est lu, son arbre construit en objets valides du modèle
# (rang de Rose absent : rang suivant, 1) et le plan attendu applicable à cet arbre. Partie lien
# (T-020) : après le plan, la fratrie de Joseph et Samuel est « frère ou demi-frère » (père
# commun, mère non précisée parmi les épouses candidates), puis change dès que la mère est
# précisée ; les mots français (T-026) sont ceux du dictionnaire, avant et après. Reste :
# l'anglais (T-027), le rattachement au père seul avec les épouses candidates à la saisie (T-033)
# et le plan de la dictée (voix, T-062).
# Écart au TRD : `creer: samuel/M` au lieu de `creer: samuel`, le genre fixant « frère ».
id: CL-POL-03
titre: Enfant du grand-père, mère inconnue parmi ses épouses
couverture:
  teste: [lecture, lien]
  reste: [T-027, T-033, T-062]
arbre:
  personnes: [pierre/M, rose/F, odile/F, joseph/M, comfort/F]
  unions:
    - { conjoints: [pierre, rose], rang_pierre: 1 }
    - { conjoints: [pierre, odile], rang_pierre: 2 }
  filiations:
    - { parents: [pierre, odile], enfant: joseph }
    - { parents: [joseph], enfant: comfort }
action:
  locuteur: comfort
  dictee: "Samuel est un fils de mon grand-père Pierre, je ne sais pas de quelle femme"
attendu:
  questions: 0
  plan:
    - creer: samuel/M
    - filiation: { parent: pierre, enfant: samuel, type: naissance }
    - candidats_mere: { enfant: samuel, candidates: [rose, odile] }
  lien: { de: joseph, vers: samuel, fr: "frère ou demi-frère", en: "brother or half-brother" }
