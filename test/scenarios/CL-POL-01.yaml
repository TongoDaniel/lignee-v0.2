# Noms générés. Partie disposition (T-008, packages/layout) : générations et foyers calculés
# depuis Oumar, puis comparés à l'attendu. Les unions sont saisies dans le désordre : seul le rang
# de Moussa compte. Ordre, placement et repli (T-012) : les épouses sur la demi-rangée dans
# l'ordre des rangs, seul le foyer de Fatou ouvert, les autres repliés avec leur compteur. Dessin
# (T-017) : la scène à peindre en pixels (cinq fiches, trois traits d'union, une descente, deux
# pastilles « + 2 ») et le parcours accessible, qui atteint les enfants des foyers repliés. Reste :
# revue visuelle sur l'Android de référence (issue #34).
id: CL-POL-01
titre: Un homme a trois épouses en même temps
couverture:
  teste: [disposition]
  reste: []
arbre:
  personnes: [moussa/M, awa/F, fatou/F, mariam/F, ali/M, binta/F, oumar/M, kadi/F, issa/M]
  unions:
    - { conjoints: [moussa, fatou], rang_moussa: 2 }
    - { conjoints: [moussa, mariam], rang_moussa: 3 }
    - { conjoints: [moussa, awa], rang_moussa: 1 }
  filiations:
    - { parents: [moussa, awa], enfant: ali }
    - { parents: [moussa, awa], enfant: binta }
    - { parents: [moussa, fatou], enfant: oumar }
    - { parents: [moussa, mariam], enfant: kadi }
    - { parents: [moussa, mariam], enfant: issa }
  simultaneites:
    - unions: [[moussa, awa], [moussa, fatou], [moussa, mariam]]
      reponse: simultanees
action:
  centre: oumar
attendu:
  generations:
    { oumar: 0, ali: 0, binta: 0, kadi: 0, issa: 0, moussa: -1, awa: -1, fatou: -1, mariam: -1 }
  unites:
    moussa:
      forme: simultanees
      foyers:
        - { conjoint: awa, enfants: [ali, binta], en_cours: true, vers_centre: false }
        - { conjoint: fatou, enfants: [oumar], en_cours: true, vers_centre: true }
        - { conjoint: mariam, enfants: [kadi, issa], en_cours: true, vers_centre: false }
  disposition:
    lignes:
      "-1": [moussa]
      "-0.5": [awa, fatou, mariam]
      "0": [oumar]
    replis:
      - { famille: [moussa, awa], replie: true, enfants: 2 }
      - { famille: [moussa, fatou], replie: false, enfants: 1 }
      - { famille: [moussa, mariam], replie: true, enfants: 2 }
  dessin:
    noeuds: 5
    unions: [[moussa, awa], [moussa, fatou], [moussa, mariam]]
    pastilles:
      - { famille: [moussa, awa], enfants: 2 }
      - { famille: [moussa, mariam], enfants: 2 }
    descentes:
      - { famille: [moussa, fatou], enfants: [oumar] }
    renvois: 0
    parcours:
      - personne: moussa
        conjoints:
          - { conjoint: awa, enfants: [ali, binta] }
          - { conjoint: fatou, enfants: [oumar] }
          - { conjoint: mariam, enfants: [kadi, issa] }
      - personne: oumar
        parents: [[moussa, fatou]]
