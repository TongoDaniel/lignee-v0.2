# Noms générés. Une seule forme de nom, sans nom de famille : acceptée telle quelle, sans champ
# vide inventé. Reste : la saisie à la main (T-031).
id: CL-DON-02
titre: Une seule forme de nom, sans nom de famille
couverture:
  teste: [modele, saisie]
  reste: []
arbre:
  personnes: [ayo/F, kossi/M]
  noms:
    - { personne: ayo, type: naissance, prenoms: Ayo }
    - { personne: kossi, type: naissance, forme: Kossivi }
attendu:
  valide: true
  affichage:
    ayo: Ayo
    kossi: Kossivi
  # T-031 : une seule forme, ou des prénoms sans nom de famille, sont enregistrés tels quels.
  saisie:
    personnes:
      - formulaire:
          noms: [{ type: naissance, forme: Kossivi }]
        resultat:
          nature: connue
          noms: [{ type: naissance, forme: Kossivi }]
      - formulaire:
          noms: [{ type: naissance, prenoms: Ayo }]
        resultat:
          nature: connue
          noms: [{ type: naissance, prenoms: Ayo }]
