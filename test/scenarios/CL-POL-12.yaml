# Noms générés. Partie disposition (T-012, packages/layout) : un chef de famille, 8 épouses en même
# temps et 5 enfants par foyer, vu depuis Carine_2 (foyer de rang 3). Par défaut, seul le foyer
# qui mène à elle est ouvert ; les 7 autres sont repliés avec le nombre de leurs enfants. Le dessin
# tient en 15 fiches de large : une par épouse repliée, la largeur de ses enfants pour Carine, en
# tête de leur colonne (ARB-03, « niveau branche »). Les frères et sœurs suivent leurs dates de
# naissance, sans date l'ordre saisi. Déplier le foyer d'Amina montre ses enfants sous elle.
# Vu depuis le chef (test), les 8 foyers sont ouverts sans chevauchement. Reste : revue visuelle
# sur l'Android de référence (T-017) et fluidité mesurée sur le téléphone (T-105).
