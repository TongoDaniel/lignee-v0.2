# Noms générés. Partie disposition (T-008, packages/layout) : Amina est au centre de ses deux
# unions simultanées, ses maris en tête de la colonne de leurs enfants, dans l'ordre de ses rangs ;
# aucun contrôle de cohérence ne signale rien (T-007), et la même famille genres inversés donne
# la même disposition. Placement (T-012) : ses maris sur la demi-rangée, chacun au-dessus de son
# enfant. Reste : revue visuelle (T-017).
id: CL-POL-14
titre: Femme avec plusieurs maris en même temps (polyandrie)
couverture:
  teste: [disposition]
  reste: [T-017]
arbre:
  personnes: [amina/F, karim/M, yves/M, sali/F, tom/M]
  unions:
    - { conjoints: [amina, yves], rang_amina: 2 }
    - { conjoints: [amina, karim], rang_amina: 1 }
  filiations:
    - { parents: [amina, karim], enfant: sali }
    - { parents: [amina, yves], enfant: tom }
  simultaneites:
    - unions: [[amina, karim], [amina, yves]]
      reponse: simultanees
action:
  centre: amina
attendu:
  sans_avertissement: true
  sans_regle_de_genre: true
  unites:
    amina:
      forme: simultanees
      foyers:
        - { conjoint: karim, enfants: [sali], en_cours: true, vers_centre: true }
        - { conjoint: yves, enfants: [tom], en_cours: true, vers_centre: true }
  disposition:
    lignes:
      "0": [amina]
      "0.5": [karim, yves]
      "1": [sali, tom]
    replis:
      - { famille: [amina, karim], replie: false, enfants: 1 }
      - { famille: [amina, yves], replie: false, enfants: 1 }
