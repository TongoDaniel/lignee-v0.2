# Noms générés. Partie modèle (T-004) : prénoms et nom sont des champs séparés, et l'ordre
# d'affichage est un réglage de l'arbre, que la fiche (T-024) suit. Reste : découper « Abenzo Lucien »
# dit ou écrit dans l'ordre NOM Prénom (voix, T-058 ; saisie, T-031).
id: CL-DON-01
titre: Nom donné dans l'ordre NOM Prénom
couverture:
  teste: [modele, fiche, saisie]
  reste: [T-058]
arbre:
  personnes: [lucien/M]
  noms:
    - { personne: lucien, type: naissance, prenoms: Lucien, nom: Abenzo }
attendu:
  champs: { prenoms: Lucien, nom: Abenzo }
  affichage:
    nom_puis_prenoms: "Abenzo Lucien"
    prenoms_puis_nom: "Lucien Abenzo"
  fiche:
    - { personne: lucien, ordre_des_noms: nom_puis_prenoms, nom_affiche: "Abenzo Lucien" }
    - { personne: lucien, ordre_des_noms: prenoms_puis_nom, nom_affiche: "Lucien Abenzo" }
  # T-031 : le formulaire garde prénoms et nom dans deux champs ; un nom écrit d'un trait se
  # sépare selon l'ordre réglé par l'arbre.
  saisie:
    decouper:
      - { ordre: nom_puis_prenoms, texte: "Abenzo Lucien", prenoms: Lucien, nom: Abenzo }
      - { ordre: prenoms_puis_nom, texte: "Lucien Abenzo", prenoms: Lucien, nom: Abenzo }
    personnes:
      - formulaire:
          noms: [{ type: naissance, prenoms: Lucien, nom: Abenzo }]
        resultat:
          nature: connue
          noms: [{ type: naissance, prenoms: Lucien, nom: Abenzo }]
