# Noms générés. Partie saisie (T-031) : un enfant mort-né ou décédé en bas âge s'ajoute comme
# n'importe quelle personne, avec une naissance et un décès le même jour. Aucune alerte de
# cohérence ne le bloque ni ne l'accompagne. « Visibilité au choix » relève des règles de
# visibilité (T-052) ; « aucun rappel » de l'absence de rappel d'anniversaire (V2).
